<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pilot Lite - Karaoke</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #000000;
            color: #ffffff;
            margin: 0;
            padding: 0;
            user-select: none;
            display: flex;
            flex-direction: column;
            height: 100dvh;
            box-sizing: border-box;
            overflow: hidden;
        }

        .status-display {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 15px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .mode-label {
            color: #bb86fc;
            font-size: 4vw;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .big-number {
            font-size: 35vw;
            font-weight: 900;
            line-height: 1;
            color: #4CAF50;
            margin: 0;
            text-shadow: 0 0 30px rgba(76, 175, 80, 0.4);
        }

        .huge-title {
            font-size: 10vw;
            font-weight: bold;
            margin: 5px 0;
            color: #ffffff;
            line-height: 1.1;
            word-wrap: break-word;
            width: 100%;
        }

        .label-small {
            color: #888;
            font-size: 3.5vw;
            text-transform: uppercase;
            margin-top: 10px;
            font-weight: bold;
        }

        .next-song {
            font-size: 6vw;
            color: #03dac6;
            margin-top: 2px;
            font-weight: bold;
        }

        .queue-item {
            font-size: 4.5vw;
            color: #777;
            margin-top: 2px;
        }

        /* KONTROLKI */
        .controls-grid {
            display: grid;
            gap: 10px;
            margin-top: 20px;
            width: 100%;
            max-width: 500px;
        }

        .grid-3 { grid-template-columns: repeat(3, 1fr); }
        .grid-4 { grid-template-columns: repeat(4, 1fr); }

        .btn {
            background: #333;
            border: none;
            color: white;
            padding: 15px 0;
            border-radius: 12px;
            font-size: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.1s;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .btn-play { background: #455a64; font-size: 34px; }
        .btn-close-tab { background: #b71c1c; font-size: 24px; }

        .btn.pressed {
            background: #e53935 !important;
            transform: scale(0.95);
        }

        .btn:disabled {
            opacity: 0.4;
            pointer-events: none;
            background: #222 !important;
            box-shadow: none;
        }
    </style>
</head>

<body>

    <div class="status-display" id="mainStatusScreen">
        <div id="uiMode" class="mode-label">Inicjalizacja...</div>
        <div id="uiMainDisplay" class="big-number">-</div>
        <div id="uiSubDisplay" class="huge-title">Czekam na dane</div>

        <div id="nextKaraokeContainer" style="display: none; width: 100%;">
            <div class="label-small">Następnie:</div>
            <div id="uiNext" class="next-song">-</div>
            <div class="label-small">W kolejce:</div>
            <div id="uiQueue" style="margin-top:5px; margin-bottom: 15px;"></div>
            
            <div class="controls-grid grid-4" style="margin: 20px auto 0 auto;">
                <button id="btnPrev" class="btn" onclick="sendCmd('prev')">⏮️</button>
                <button id="btnPlay" class="btn btn-play" onclick="sendCmd('play')">▶️</button>
                <button id="btnNext" class="btn" onclick="sendCmd('next')">⏭️</button>
                <button id="btnClose" class="btn btn-close-tab" onclick="sendCmd('close')" title="Zamknij Kartę">✖</button>
            </div>
        </div>

        <div id="nextKonkursContainer" style="display: none; margin-top: 20px; border-top: 1px solid #333; width: 100%; padding-top: 10px;">
            <div class="label-small">Następny w kolejce:</div>
            <div style="display: flex; align-items: center; justify-content: center; gap: 15px; margin-top: 5px;">
                <span id="uiNextIdx" style="font-size: 10vw; font-weight: 900; color: #fb8c00;">-</span>
                <span id="uiNextName" style="font-size: 6vw; color: #aaa; text-align: left; flex: 1;">-</span>
            </div>

            <div class="controls-grid grid-3" style="margin: 30px auto 0 auto;">
                <button id="btnPrevK" class="btn" onclick="sendCmd('prev')">⏮️</button>
                <button id="btnPlayK" class="btn btn-play" onclick="sendCmd('play')">▶️</button>
                <button id="btnNextK" class="btn" onclick="sendCmd('next')">⏭️</button>
            </div>
        </div>

        <div id="loteriaContainer" style="display: none; width: 100%; margin-top: 20px;">
            <button class="btn" style="background: #e91e63; font-weight: bold; width: 100%; padding: 20px; font-size: 24px; box-shadow: 0 4px 15px rgba(233, 30, 99, 0.4); text-transform: uppercase;" onclick="sendCmd('start_lottery')">
                🎉 Losuj Zwycięzcę
            </button>
            <div class="label-small" style="margin-top: 25px; text-align: center; color: #bbb;">🏆 Ostatni Zwycięzcy:</div>
            <ul id="winnersListRemote" style="list-style: none; padding: 0; margin-top: 10px; max-height: 35dvh; overflow-y: auto; text-align: left;">
                <li style="text-align: center; color: #777; padding: 10px;">Czekam na dane...</li>
            </ul>
        </div>
    </div>

    <div style="position: fixed; bottom: 15px; left: 15px; right: 15px; display: flex; justify-content: center; z-index: 9999;">
        <button onclick="forceUnlockUI()" title="Odblokuj przyciski i wymuś zresetowanie blokady"
            style="width:100%; max-width: 250px; background: rgba(34, 34, 34, 0.85); border: 1px solid #555; color: #ccc; border-radius: 12px; padding: 12px; font-size: 14px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5);">
            🔄 Reset UI
        </button>
    </div>

    <script>
        // =====================================
        // KONFIGURACJA API (TYLKO FIREBASE)
        // =====================================
        const firebaseConfig = {
            apiKey: "AIzaSyDBjS0W8W6iwy3i3yaVVCyMF-FimS1VzH4",
            authDomain: "indeks-karaoke.firebaseapp.com",
            databaseURL: "https://indeks-karaoke-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "indeks-karaoke",
            storageBucket: "indeks-karaoke.firebasestorage.app",
            messagingSenderId: "870801348066",
            appId: "1:870801348066:web:1eb45469e18a2ea45e15bb"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let myPin = localStorage.getItem('dj_pin') || prompt("🔒 Podaj PIN DJ-a:");
        if (myPin) localStorage.setItem('dj_pin', myPin);

        let lastCmdTs = 0;
        let unlockTimeout = null;
        let isPlaying = false;
        let waitingForSongChange = false;
        let lastSongName = "";
        let isKonkursEmpty = false; // Zabezpieczenie dla trybu konkursu

        const uiMode = document.getElementById('uiMode');
        const uiMain = document.getElementById('uiMainDisplay');
        const uiSub = document.getElementById('uiSubDisplay');
        const uiNext = document.getElementById('uiNext');
        const uiQueue = document.getElementById('uiQueue');
        const nextKaraokeContainer = document.getElementById('nextKaraokeContainer');
        const nextKonkursContainer = document.getElementById('nextKonkursContainer');
        const loteriaContainer = document.getElementById('loteriaContainer');

        db.ref('remote_status').on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            const newTitle = data.currentName || "Brak utworu";
            
            // Logika sprawdzająca czy jest aktywna karta w trybie konkurs
            isKonkursEmpty = (data.mode === 'konkurs' && (newTitle === "Brak aktywnej karty" || newTitle === "Brak utworu" || newTitle === "-"));

            if (waitingForSongChange) {
                if (newTitle !== lastSongName) {
                    waitingForSongChange = false;
                    unlockButtons();
                }
            } else if (data.lastAckTs && data.lastAckTs === lastCmdTs) {
                unlockButtons();
            }

            uiMode.textContent = data.mode ? `TRYB: ${data.mode.toUpperCase()}` : "";

            if (data.mode === 'karaoke') {
                uiMain.style.display = 'none';
                uiSub.textContent = newTitle;
                uiSub.style.fontSize = '12vw';
                nextKaraokeContainer.style.display = 'block';
                nextKonkursContainer.style.display = 'none';
                loteriaContainer.style.display = 'none';
                uiNext.textContent = data.nextName || "-";

                uiQueue.innerHTML = '';
                if (data.queueList) {
                    data.queueList.forEach(song => {
                        const div = document.createElement('div');
                        div.className = 'queue-item';
                        div.textContent = song;
                        uiQueue.appendChild(div);
                    });
                }
            }
            else if (data.mode === 'konkurs') {
                uiMain.style.display = 'block';
                uiMain.textContent = data.konkursIndex || "1";
                uiSub.textContent = newTitle;
                uiSub.style.fontSize = '8vw';
                nextKaraokeContainer.style.display = 'none';
                nextKonkursContainer.style.display = 'block';
                loteriaContainer.style.display = 'none';
                document.getElementById('uiNextIdx').textContent = data.nextKonkursIndex || "-";
                document.getElementById('uiNextName').textContent = data.nextName || "-";
            }
            else if (data.mode === 'loteria') {
                uiMain.style.display = 'none';
                uiSub.textContent = "LOSOWANIE";
                uiSub.style.fontSize = '15vw';
                nextKaraokeContainer.style.display = 'none';
                nextKonkursContainer.style.display = 'none';
                loteriaContainer.style.display = 'block';

                const winnersList = document.getElementById('winnersListRemote');
                winnersList.innerHTML = '';
                if (data.winners && data.winners.length > 0) {
                    data.winners.forEach(w => {
                        winnersList.innerHTML += `
                            <li style="background: #2c2c2c; margin-bottom: 8px; padding: 12px; border-radius: 8px; border-left: 4px solid #e91e63;">
                                <div style="font-weight: bold; font-size: 18px; color: #fff;">${w.name}</div>
                                <div style="color: #aaa; font-size: 14px; margin-top: 4px;">Zgłoszenie: <b style="color:#e91e63;">${w.code}</b></div>
                            </li>
                        `;
                    });
                } else {
                    winnersList.innerHTML = '<li style="text-align: center; color: #777; padding: 10px;">Brak zwycięzców w tej sesji</li>';
                }
            }
        });

        function sendCmd(action, value = null) {
            if (!myPin) { location.reload(); return; }

            // Zabezpieczenie przed wymuszonym odpaleniem play gdy slot jest wolny
            if (action === 'play' && isKonkursEmpty) return;

            if (action === 'play') {
                isPlaying = !isPlaying;
                const btnPlay = document.getElementById('btnPlay');
                const btnPlayK = document.getElementById('btnPlayK');
                if (btnPlay) btnPlay.textContent = isPlaying ? '⏸️' : '▶️';
                if (btnPlayK && !isKonkursEmpty) btnPlayK.textContent = isPlaying ? '⏸️' : '▶️';
            }
            else if (action === 'close' || action === 'prev' || action === 'next') {
                isPlaying = false;
                const btnPlay = document.getElementById('btnPlay');
                const btnPlayK = document.getElementById('btnPlayK');
                if (btnPlay) btnPlay.textContent = '▶️';
                if (btnPlayK && !isKonkursEmpty) btnPlayK.textContent = '▶️';
            }

            const buttonsIds = ['btnPrev', 'btnPlay', 'btnNext', 'btnClose', 'btnPrevK', 'btnPlayK', 'btnNextK'];
            if (action === 'prev' || action === 'next' || action === 'play' || action === 'close') {
                buttonsIds.forEach(id => {
                    const btn = document.getElementById(id);
                    if (btn) btn.disabled = true;
                });
            }

            // Animacja kliknięcia
            let targetBtn1 = document.getElementById('btn' + action.charAt(0).toUpperCase() + action.slice(1));
            let targetBtn2 = document.getElementById('btn' + action.charAt(0).toUpperCase() + action.slice(1) + 'K');
            if (targetBtn1) targetBtn1.classList.add('pressed');
            if (targetBtn2) targetBtn2.classList.add('pressed');

            lastCmdTs = Date.now();

            if (action === 'prev' || action === 'next') {
                waitingForSongChange = true;
                lastSongName = uiSub.textContent;

                clearTimeout(unlockTimeout);
                unlockTimeout = setTimeout(() => {
                    waitingForSongChange = false;
                    unlockButtons();
                }, 4000);
            } else {
                waitingForSongChange = false;
                clearTimeout(unlockTimeout);
                unlockTimeout = setTimeout(unlockButtons, 1500);
            }

            db.ref('remote_cmd').set({ action: action, value: value, pin: myPin, ts: lastCmdTs })
                .catch(e => { localStorage.removeItem('dj_pin'); location.reload(); });

            if (navigator.vibrate) navigator.vibrate(40);
        }

        function unlockButtons() {
            ['btnPrev', 'btnPlay', 'btnNext', 'btnClose', 'btnPrevK', 'btnPlayK', 'btnNextK'].forEach(id => {
                let btn = document.getElementById(id);
                if (btn) {
                    if (id === 'btnPlayK' && isKonkursEmpty) {
                        btn.disabled = true;
                        btn.textContent = '-';
                        btn.classList.remove('pressed');
                    } else if (id.includes('Play') || id.includes('Close')) {
                        btn.disabled = false;
                        btn.classList.remove('pressed');
                        if (id === 'btnPlay' || id === 'btnPlayK') {
                            btn.textContent = isPlaying ? '⏸️' : '▶️';
                        }
                    } else {
                        btn.disabled = isPlaying;
                        btn.classList.remove('pressed');
                    }
                }
            });
        }

        function forceUnlockUI() {
            waitingForSongChange = false;
            isPlaying = false;

            const btnPlay = document.getElementById('btnPlay');
            const btnPlayK = document.getElementById('btnPlayK');
            if (btnPlay) btnPlay.textContent = '▶️';
            if (btnPlayK) btnPlayK.textContent = isKonkursEmpty ? '-' : '▶️';

            unlockButtons();

            if (navigator.vibrate) navigator.vibrate(20);
        }
    </script>
</body>

</html>
