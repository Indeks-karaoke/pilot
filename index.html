<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pilot DJ'a - Karaoke</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #000000;
            color: #ffffff;
            margin: 0;
            padding: 0;
            user-select: none;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* GÓRNY PASEK ZAKŁADEK */
        .top-bar {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: #111;
            border-bottom: 1px solid #333;
        }

        .top-btn {
            background: #222;
            color: #ccc;
            border: 1px solid #444;
            border-radius: 10px;
            padding: 15px 5px;
            font-size: 24px;
            flex: 1;
            margin: 0 4px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .top-btn.active {
            background: #4CAF50;
            border-color: #4CAF50;
        }

        /* ROZWIJANE PANELE */
        .panel {
            background: #1a1a1a;
            padding: 15px;
            margin: 10px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            display: none;
        }

        .status-display {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 10px;
            overflow: hidden;
            transition: all 0.3s ease;
            touch-action: pan-y;
        }

        .mode-label {
            color: #bb86fc;
            font-size: 4vw;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .big-number {
            font-size: 35vw;
            font-weight: 900;
            line-height: 1;
            color: #4CAF50;
            margin: 0;
            text-shadow: 0 0 30px rgba(76, 175, 80, 0.4);
        }

        .huge-title {
            font-size: 10vw;
            font-weight: bold;
            margin: 5px 0;
            color: #ffffff;
            line-height: 1.1;
            word-wrap: break-word;
            width: 100%;
            pointer-events: none;
        }

        .label-small {
            color: #888;
            font-size: 3.5vw;
            text-transform: uppercase;
            margin-top: 10px;
            font-weight: bold;
        }

        .next-song {
            font-size: 6vw;
            color: #03dac6;
            margin-top: 2px;
            font-weight: bold;
            pointer-events: none;
        }

        .queue-item {
            font-size: 4.5vw;
            color: #777;
            margin-top: 2px;
        }

        /* KONTROLKI */
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 10px;
        }

        .btn {
            background: #333;
            border: none;
            color: white;
            padding: 15px 0;
            border-radius: 12px;
            font-size: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.1s;
            cursor: pointer;
        }

        .btn-play {
            background: #455a64;
            font-size: 34px;
        }

        .btn.pressed {
            background: #e53935 !important;
            transform: scale(0.95);
        }

        .btn:disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        .sfx-btn {
            padding: 12px 0;
            font-size: 20px;
            flex: 1;
            margin: 0 3px;
            background: #444;
            border-radius: 8px;
        }

        /* LISTY I KARTY */
        .clickable-item {
            background: #2c2c2c;
            margin-bottom: 8px;
            padding: 15px;
            border-radius: 10px;
            transition: background 0.2s, transform 0.1s;
        }

        .clickable-item.interactive:active {
            transform: scale(0.98);
            background: #444;
        }

        .order-title {
            font-size: 16px;
            font-weight: bold;
            line-height: 1.3;
            margin-bottom: 4px;
        }

        .order-singer {
            color: #aaa;
            font-size: 13px;
            display: block;
        }

        .badge {
            color: #fff;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 12px;
            margin-right: 8px;
            vertical-align: middle;
            font-weight: bold;
        }

        .badge-yt {
            background: #c62828;
        }

        .badge-ising {
            background: #0288d1;
        }

        .tiny-btn {
            background: #444;
            border: none;
            color: white;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .tiny-btn:disabled {
            opacity: 0.2;
            pointer-events: none;
        }
    </style>
</head>

    <script>
        // =====================================
        // WKLEJ TUTAJ SWÓJ URL Z APPS SCRIPT!
        // =====================================
        const APPS_SCRIPT_PROXY_URL = 'https://script.google.com/macros/s/AKfycbzEyimmaojILmadkGvOoGEX0VsSxzucNWAwencvaYxhr_EdhjG1N2Vs0G2q6OZQkLEstw/exec';

        const firebaseConfig = {
            apiKey: "AIzaSyDBjS0W8W6iwy3i3yaVVCyMF-FimS1VzH4",
            authDomain: "indeks-karaoke.firebaseapp.com",
            databaseURL: "https://indeks-karaoke-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "indeks-karaoke",
            storageBucket: "indeks-karaoke.firebasestorage.app",
            messagingSenderId: "870801348066",
            appId: "1:870801348066:web:1eb45469e18a2ea45e15bb"
        };


        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let myPin = localStorage.getItem('dj_pin') || prompt("🔒 Podaj PIN DJ-a:");
        if (myPin) localStorage.setItem('dj_pin', myPin);

        let lastCmdTs = 0;
        let unlockTimeout = null;
        let isPlaying = false;
        let waitingForSongChange = false;
        let lastSongName = "";
        let currentModeInternal = "karaoke";

        let localBaza = [];

        const uiMode = document.getElementById('uiMode');
        const uiMain = document.getElementById('uiMainDisplay');
        const uiSub = document.getElementById('uiSubDisplay');
        const uiNext = document.getElementById('uiNext');
        const uiQueue = document.getElementById('uiQueue');
        const nextKaraokeContainer = document.getElementById('nextKaraokeContainer');
        const nextKonkursContainer = document.getElementById('nextKonkursContainer');
        const topBar = document.getElementById('topBar');
        const autoPlayToggle = document.getElementById('autoPlayToggle');
        const konkursControls = document.getElementById('konkursControls');

        function toggleTab(tabName) {
            const tabs = ['orders', 'search', 'list', 'controls'];
            tabs.forEach(t => {
                const el = document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1));
                const btn = document.getElementById('btnTab' + t.charAt(0).toUpperCase() + t.slice(1));
                if (t === tabName) {
                    const isVisible = el.style.display === 'block';
                    el.style.display = isVisible ? 'none' : 'block';
                    if (btn) btn.classList.toggle('active', !isVisible);
                } else {
                    if (el) el.style.display = 'none';
                    if (btn) btn.classList.remove('active');
                }
            });
        }

        const statusScreen = document.getElementById('mainStatusScreen');
        let touchStartX = 0;
        let touchEndX = 0;
        const availableModes = ['karaoke', 'konkurs', 'loteria'];

        statusScreen.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        statusScreen.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });

        function handleSwipe() {
            const threshold = 80;
            let currentIndex = availableModes.indexOf(currentModeInternal);
            if (currentIndex === -1) currentIndex = 0;

            if (touchEndX < touchStartX - threshold) {
                let nextMode = availableModes[(currentIndex + 1) % availableModes.length];
                sendCmd('set_mode', nextMode);
                toggleTab('');
            }
            if (touchEndX > touchStartX + threshold) {
                let prevMode = availableModes[(currentIndex - 1 + availableModes.length) % availableModes.length];
                sendCmd('set_mode', prevMode);
                toggleTab('');
            }
        }

        async function fetchBackgroundData() {
            if (APPS_SCRIPT_PROXY_URL.includes('Wklej_Tutaj')) return;
            try {
                const res = await fetch(APPS_SCRIPT_PROXY_URL);
                const gist = await res.json();
                if (gist.error) throw new Error(gist.error);

                if (gist.files['baza.json']) {
                    localBaza = JSON.parse(gist.files['baza.json'].content);
                    document.getElementById('searchStatus').textContent = `✅ Baza załadowana (${localBaza.length} utworów)`;
                }

                if (gist.files['zamowienia.json']) {
                    const data = JSON.parse(gist.files['zamowienia.json'].content);
                    const now = Date.now();
                    const eightHoursInMs = 8 * 60 * 60 * 1000;

                    let uniqueOrders = {};
                    data.forEach(o => {
                        if ((now - (o.id || o.timestamp)) <= eightHoursInMs && !o.zagrane) {
                            let key = o.tytul.toLowerCase().trim();
                            if (!uniqueOrders[key]) uniqueOrders[key] = o;
                        }
                    });

                    const list = document.getElementById('ordersListRemote');
                    list.innerHTML = '';
                    let orderCount = 0;

                    Object.values(uniqueOrders).forEach(o => {
                        orderCount++;
                        const card = document.createElement('div');
                        card.className = 'clickable-item interactive';
                        card.innerHTML = `<div class="order-title">${o.tytul}</div><span class="order-singer">🎤 ${o.imie || 'Wybór własny'}</span>`;
                        card.onclick = () => sendPlayOrder(card, o.tytul);
                        list.appendChild(card);
                    });

                    if (orderCount === 0) list.innerHTML = '<div style="text-align: center; color: #aaa; padding: 20px;">📭 Brak niezrealizowanych zamówień.</div>';
                }
            } catch (e) { }
        }

        fetchBackgroundData();
        setInterval(fetchBackgroundData, 10000);

        function clearSearch() {
            const input = document.getElementById('searchInputRemote');
            input.value = '';
            document.getElementById('clearSearchBtn').style.display = 'none';
            document.getElementById('searchListRemote').innerHTML = '';
            input.focus();
        }

        function handleLocalSearch(query) {
            const list = document.getElementById('searchListRemote');
            document.getElementById('clearSearchBtn').style.display = query.length > 0 ? 'block' : 'none';

            list.innerHTML = '';
            query = query.toLowerCase().trim();
            if (query.length < 2) return;

            const results = localBaza.filter(s => s.title.toLowerCase().includes(query)).slice(0, 15);
            if (results.length === 0) {
                list.innerHTML = '<li style="color:#aaa; padding: 10px 0; text-align:center;">Brak wyników w bazie.</li>';
                return;
            }
            results.forEach(song => {
                const li = document.createElement('li');
                li.className = 'clickable-item interactive';
                li.style.cssText = 'font-size: 15px; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;';
                const isIsing = song.url && song.url.includes('ising.pl');
                const badgeClass = isIsing ? 'badge badge-ising' : 'badge badge-yt';
                li.innerHTML = `<span class="${badgeClass}">${isIsing ? 'iSing' : 'YT'}</span> <span style="vertical-align: middle;">${song.title}</span>`;
                li.onclick = () => sendPlayOrder(li, song.title);
                list.appendChild(li);
            });
        }

        function sendPlayOrder(element, title) {
            sendCmd('play_order', title);
            const originalBg = element.style.background;
            element.style.background = '#1b5e20';
            setTimeout(() => { element.style.background = originalBg; }, 600);
            setTimeout(() => { toggleTab(''); }, 700);
        }

        // ==== OBNIŻONE, ZWIĘZŁE KARTY Z PRZYCISKIEM SKOKU NA PRAWO ====
        function renderOpenTabsList(tabs) {
            const container = document.getElementById('openTabsContainer');
            if (!tabs || tabs.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: #aaa; padding: 20px;">Brak otwartych kart z muzyką.</div>';
                return;
            }

            let html = '';
            tabs.forEach((t, i) => {
                html += `
                <div style="background: #2c2c2c; margin-bottom: 6px; padding: 8px 10px; border-radius: 8px; display:flex; align-items:center; gap: 10px;">
                    <div style="display:flex; flex-direction:column; gap: 3px;">
                        <button class="tiny-btn" onclick="sendCmd('move_tab', {id: ${t.id}, dir: -1})" ${i === 0 ? 'disabled' : ''} title="Wyżej">▲</button>
                        <button class="tiny-btn" onclick="sendCmd('move_tab', {id: ${t.id}, dir: 1})" ${i === tabs.length - 1 ? 'disabled' : ''} title="Niżej">▼</button>
                    </div>
                    <div style="flex:1; word-break: break-word; white-space: normal; font-size:13px; font-weight:bold; line-height: 1.2;">
                        ${t.title}
                    </div>
                    <button class="tiny-btn" style="background:#4CAF50; padding:10px 10px; font-size:16px;" onclick="sendCmd('move_tab_top', ${t.id})" ${i === 0 ? 'disabled' : ''} title="Przesuń na samą górę">⏫</button>
                    <button style="background:#d32f2f; border:none; color:white; padding:10px 12px; border-radius:6px; font-weight:bold; font-size:14px; cursor:pointer;" onclick="sendCmd('close_tab', ${t.id})" title="Zamknij">✖</button>
                </div>`;
            });
            container.innerHTML = html;
        }

        db.ref('remote_status').on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            if (data.mode && currentModeInternal !== data.mode) {
                currentModeInternal = data.mode;
                toggleTab('');
            }

            const newTitle = data.currentName || "Brak utworu";

            if (data.hasOwnProperty('autoPlay')) autoPlayToggle.checked = data.autoPlay;
            // Dodano OR [], aby uchronić listę przed zamrożeniem po usunięciu ostatniej karty
            renderOpenTabsList(data.openTabs || []);

            if (waitingForSongChange) {
                if (newTitle !== lastSongName) {
                    waitingForSongChange = false;
                    unlockButtons();
                }
            } else if (data.lastAckTs && data.lastAckTs === lastCmdTs) {
                unlockButtons();
            }

            uiMode.textContent = data.mode ? `TRYB: ${data.mode.toUpperCase()}` : "";

            if (data.mode === 'karaoke') {
                topBar.style.display = 'flex';
                uiMain.style.display = 'none';
                uiSub.textContent = newTitle;
                uiSub.style.fontSize = '12vw';
                nextKaraokeContainer.style.display = 'block';
                nextKonkursContainer.style.display = 'none';
                konkursControls.style.display = 'none';
                uiNext.textContent = data.nextName || "-";

                uiQueue.innerHTML = '';
                if (data.queueList) {
                    data.queueList.forEach(song => {
                        const div = document.createElement('div');
                        div.className = 'queue-item';
                        div.textContent = song;
                        uiQueue.appendChild(div);
                    });
                }
            }
            else if (data.mode === 'konkurs') {
                topBar.style.display = 'none';
                uiMain.style.display = 'block';
                uiMain.textContent = data.konkursIndex || "1";
                uiSub.textContent = newTitle;
                uiSub.style.fontSize = '8vw';
                nextKaraokeContainer.style.display = 'none';
                nextKonkursContainer.style.display = 'block';
                konkursControls.style.display = 'block';
                document.getElementById('uiNextIdx').textContent = data.nextKonkursIndex || "-";
                document.getElementById('uiNextName').textContent = data.nextName || "-";
            }
            else if (data.mode === 'loteria') {
                topBar.style.display = 'none';
                uiMain.style.display = 'none';
                uiSub.textContent = "LOTERIA";
                uiSub.style.fontSize = '15vw';
                nextKaraokeContainer.style.display = 'none';
                nextKonkursContainer.style.display = 'none';
                konkursControls.style.display = 'none';
            }
        });

        function sendCmd(action, value = null) {
            if (!myPin) { location.reload(); return; }

            if (action === 'play') {
                isPlaying = !isPlaying;
                const btnPlay = document.getElementById('btnPlay');
                const btnPlayK = document.getElementById('btnPlayK');
                if (btnPlay) btnPlay.textContent = isPlaying ? '⏸️' : '▶️';
                if (btnPlayK) btnPlayK.textContent = isPlaying ? '⏸️' : '▶️';
            }
            else if (action === 'close' || action === 'close_tab' || action === 'prev' || action === 'next' || action === 'play_order') {
                isPlaying = false;
                const btnPlay = document.getElementById('btnPlay');
                const btnPlayK = document.getElementById('btnPlayK');
                if (btnPlay) btnPlay.textContent = '▶️';
                if (btnPlayK) btnPlayK.textContent = '▶️';
            }

            const buttonsIds = ['btnPrev', 'btnPlay', 'btnNext', 'btnPrevK', 'btnPlayK', 'btnNextK'];
            if (action === 'prev' || action === 'next' || action === 'play') {
                buttonsIds.forEach(id => {
                    const btn = document.getElementById(id);
                    if (btn) btn.disabled = true;
                });
            }

            let targetBtn1 = document.getElementById('btn' + action.charAt(0).toUpperCase() + action.slice(1));
            let targetBtn2 = document.getElementById('btn' + action.charAt(0).toUpperCase() + action.slice(1) + 'K');
            if (targetBtn1) targetBtn1.classList.add('pressed');
            if (targetBtn2) targetBtn2.classList.add('pressed');

            lastCmdTs = Date.now();

            if (action === 'prev' || action === 'next' || action === 'play_order') {
                waitingForSongChange = true;
                lastSongName = uiSub.textContent;

                clearTimeout(unlockTimeout);
                unlockTimeout = setTimeout(() => {
                    waitingForSongChange = false;
                    unlockButtons();
                }, 4000);
            } else {
                waitingForSongChange = false;
                clearTimeout(unlockTimeout);
                unlockTimeout = setTimeout(unlockButtons, 1500);
            }

            db.ref('remote_cmd').set({ action: action, value: value, pin: myPin, ts: lastCmdTs })
                .catch(e => { localStorage.removeItem('dj_pin'); location.reload(); });

            if (navigator.vibrate) navigator.vibrate(40);
        }

        function unlockButtons() {
            ['btnPrev', 'btnPlay', 'btnNext', 'btnPrevK', 'btnPlayK', 'btnNextK'].forEach(id => {
                let btn = document.getElementById(id);
                if (btn) {
                    if (id.includes('Play')) {
                        btn.disabled = false;
                        btn.classList.remove('pressed');
                    } else {
                        btn.disabled = isPlaying;
                        btn.classList.remove('pressed');
                    }
                }
            });
        }
        function forceUnlockUI() {
            waitingForSongChange = false;
            isPlaying = false;

            const btnPlay = document.getElementById('btnPlay');
            const btnPlayK = document.getElementById('btnPlayK');
            if (btnPlay) btnPlay.textContent = '▶️';
            if (btnPlayK) btnPlayK.textContent = '▶️';

            unlockButtons();

            if (navigator.vibrate) navigator.vibrate(20);
        }
        function sendOverlay(active, target) {
            if (!myPin) { location.reload(); return; }

            const text = document.getElementById('ovText').value.trim();
            const img = document.getElementById('ovImg').value.trim();
            const audio = document.getElementById('ovAudio').value.trim();

            const payload = { active: active };

            if (active) {
                payload.text = text;
                payload.imageUrl = img;
                payload.audioUrl = audio;
                payload.timestamp = Date.now();
            }

            // KIEROWANIE RUCHU ZALEŻNIE OD WYBRANEGO EKRANU
            if (target === 'roboczy') {
                sendCmd('custom_overlay', payload);
            } else if (target === 'tv') {
                sendCmd('tv_overlay', payload);
            }

            // Lekka wibracja jako potwierdzenie (jeśli obsługiwana)
            if (navigator.vibrate) navigator.vibrate(20);
        }
        // POBIERANIE GIFÓW Z PUBLICZNEGO API TENOR
        async function searchGifs() {
            const query = document.getElementById('gifSearchQuery').value.trim();
            const resultsDiv = document.getElementById('gifResults');
            if (!query) return;

            resultsDiv.innerHTML = '<span style="color:#aaa; font-size:12px;">Szukam...</span>';

            try {
                // Używamy publicznego klucza testowego LIVDSRZULELA
                const res = await fetch(`https://g.tenor.com/v1/search?q=${encodeURIComponent(query)}&key=LIVDSRZULELA&limit=8`);
                const data = await res.json();

                resultsDiv.innerHTML = '';
                if (data.results && data.results.length > 0) {
                    data.results.forEach(gif => {
                        const url = gif.media[0].gif.url;
                        const preview = gif.media[0].nanogif.url; // Mniejsza wersja do podglądu

                        const img = document.createElement('img');
                        img.src = preview;
                        img.style.height = '60px';
                        img.style.borderRadius = '4px';
                        img.style.cursor = 'pointer';
                        img.style.border = '2px solid transparent';

                        // Po kliknięciu wkleja link GIFa do głównego pola
                        img.onclick = () => {
                            document.getElementById('ovImg').value = url;
                            // Resetujemy obramówki innych i zaznaczamy kliknięty
                            Array.from(resultsDiv.children).forEach(c => c.style.borderColor = 'transparent');
                            img.style.borderColor = '#9c27b0';
                        };

                        resultsDiv.appendChild(img);
                    });
                } else {
                    resultsDiv.innerHTML = '<span style="color:#aaa; font-size:12px;">Brak wyników</span>';
                }
            } catch (e) {
                resultsDiv.innerHTML = '<span style="color:#f44336; font-size:12px;">Błąd pobierania</span>';
            }
        }

        // Pozwala wyszukiwać wciskając ENTER na klawiaturze w polu GIF
        document.getElementById('gifSearchQuery').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                searchGifs();
            }
        });
    </script>
</body>
